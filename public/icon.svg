<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1400"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.5"/>

  <!-- Algeria Flag Circle Emblem -->
  <g transform="translate(256, 120)">
    <circle r="48" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M-48,0 A48,48 0 0,1 0,-48 L0,48 A48,48 0 0,1 -48,0 Z" fill="#006633"/>
    <path d="M0,-48 A48,48 0 0,1 48,0 A48,48 0 0,1 0,48 Z" fill="#ffffff"/>
    <!-- Crescent and Star -->
    <path d="M4,-22 A24,24 0 1,0 4,22 A20,20 0 1,1 4,-22 Z" fill="#d21034"/>
    <polygon points="12,0 18,-6 16,3 23,-2 15,-1 18,7 11,2 7,8 8,-1 1,-3" fill="#d21034" transform="scale(0.8) translate(8, -2)"/>
  </g>

  <!-- AI Brain Grid / Mic Icon Left -->
  <g transform="translate(140, 240)" fill="url(#goldLight)">
    <!-- Microphone -->
    <rect x="-12" y="-30" width="24" height="40" rx="12" fill="url(#goldLight)"/>
    <path d="M-22,-10 A22,22 0 0,0 22,-10" fill="none" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="0" y2="28" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-12" y1="28" x2="12" y2="28" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- AI Brain Right -->
  <g transform="translate(370, 240)" stroke="url(#goldLight)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20,-25 C-35,-25 -40,-10 -35,5 C-40,20 -25,35 -10,30 C0,35 15,30 20,20 C30,15 30,-5 20,-15 C20,-25 0,-30 -20,-25 Z"/>
    <circle cx="-10" cy="-5" r="4" fill="url(#goldLight)"/>
    <circle cx="10" cy="5" r="4" fill="url(#goldLight)"/>
    <line x1="-10" y1="-5" x2="10" y2="5"/>
  </g>

  <!-- Center Text / Banner -->
  <rect x="80" y="320" width="352" height="64" rx="16" fill="#18181b" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <text x="256" y="362" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    PRO GÉNÉRATEUR AI
  </text>

  <!-- Subtitle Text -->
  <text x="256" y="420" font-family="sans-serif" font-weight="bold" font-size="22" fill="#fef08a" text-anchor="middle">
    مولد المذكرات الاحترافي
  </text>
  
  <!-- PRO Badge -->
  <rect x="206" y="440" width="100" height="30" rx="15" fill="url(#goldGrad)"/>
  <text x="256" y="461" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#000000" text-anchor="middle">
    PRO
  </text>
</svg>
